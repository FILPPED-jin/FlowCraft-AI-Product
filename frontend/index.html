<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon/main.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Injected code for hosted version -->
    <%- injectHead %>

    <title>FlowCraft AI</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FlowCraft AI" />
    <meta
      property="og:description"
      content="Convert screenshots into interaction prototypes with design diagnosis"
    />
    <meta
      property="og:image"
      content="https://bd3e8a3b.flowcraft-ai-product.pages.dev/brand/twitter-summary-card.png"
    />
    <meta property="og:image:width" content="1736" />
    <meta property="og:image:height" content="907" />
    <meta
      property="og:url"
      content="https://bd3e8a3b.flowcraft-ai-product.pages.dev/"
    />
    <meta property="og:type" content="website" />
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Keep in sync with og:title, og:description and og:image -->
    <meta name="twitter:title" content="FlowCraft AI" />
    <meta
      name="twitter:description"
      content="Convert screenshots into interaction prototypes with design diagnosis"
    />
    <meta
      name="twitter:image"
      content="https://bd3e8a3b.flowcraft-ai-product.pages.dev/brand/twitter-summary-card.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.dataset.flowcraftMounted === "true") return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#111827;font-family:Inter,Arial,sans-serif;padding:24px;">' +
          '<div style="max-width:420px;border:1px solid #e5e7eb;background:white;border-radius:12px;padding:24px;box-shadow:0 12px 30px rgba(15,23,42,.08);">' +
          '<div style="font-size:13px;font-weight:700;color:#6b7280;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">FlowCraft AI</div>' +
          '<h1 style="font-size:22px;line-height:1.25;margin:0 0 10px;">App did not finish loading</h1>' +
          '<p style="font-size:14px;line-height:1.6;color:#4b5563;margin:0 0 16px;">The local dev server returned the HTML shell, but the React app did not mount. Refresh the page once; if it keeps happening, restart the frontend dev server.</p>' +
          '<button onclick="window.location.reload()" style="height:38px;border:0;border-radius:8px;background:#111827;color:white;padding:0 14px;font-weight:700;cursor:pointer;">Refresh FlowCraft</button>' +
          "</div></div>";
      }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
